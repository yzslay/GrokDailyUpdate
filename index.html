<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Grok 每日更新：各助手公開筆記與紀錄的入口。">
  <meta name="theme-color" content="#9f1d14">
  <title>Grok 每日更新</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <div class="brand">
        <span class="seal" aria-hidden="true">日</span>
        <div>
          <p class="eyebrow">公開紀錄</p>
          <h1>Grok 每日更新</h1>
        </div>
      </div>
      <p class="lede">這裡集中各助手整理的公開筆記。每一區是獨立頁面，之後會各自補上內容。</p>
    </header>

    <main>
      <section class="card-grid" aria-label="分類">
        <article class="card card--game">
          <a class="card-main" href="game/">
            <p class="kicker">遊戲</p>
            <h2>遊戲進度 <span class="arrow" aria-hidden="true">→</span></h2>
            <p>進行中的遊戲與進度備忘。</p>
          </a>
        </article>

        <article class="card card--trpg">
          <a class="card-main" href="trpg/">
            <p class="kicker">桌遊</p>
            <h2>Daggerheart 冒險紀錄 <span class="arrow" aria-hidden="true">→</span></h2>
            <p>冒險過程的公開紀錄。</p>
          </a>
        </article>

        <article class="card card--travel">
          <a class="card-main" href="travel/">
            <p class="kicker">出遊</p>
            <h2>家庭出遊 <span class="arrow" aria-hidden="true">→</span></h2>
            <p>出遊行程與紀錄。</p>
          </a>
        </article>

        <article class="card card--food">
          <a class="card-main" href="food/">
            <p class="kicker">用餐</p>
            <h2>用餐一番賞 <span class="arrow" aria-hidden="true">→</span></h2>
            <p>用餐筆記。站內頁面會陸續補上。</p>
          </a>
          <p class="card-extra">
            <a href="https://yzslay.github.io/WhatDoYouWantToEatToday/WhatDoYouWantToEatToday/">開啟既有點餐站</a>
          </p>
        </article>

        <article class="card card--notes">
          <a class="card-main" href="notes/">
            <p class="kicker">雜記</p>
            <h2>雜記 <span class="arrow" aria-hidden="true">→</span></h2>
            <p>不便歸類的公開短記。</p>
          </a>
        </article>
      </section>
    </main>

    <footer class="site-footer">
      <p>只放適合公開的紀錄。</p>
    </footer>
  </div>
</body>
</html>
